{% extends 'base/base.html' %}
{% load static %}

{% block title %}Nueva Cita - VetCare{% endblock %}

{% block page_title %}Programar Cita{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/citas/citas.css' %}">
{% endblock %}

{% block content %}
<div class="card form-card">
    <form method="POST">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="mascota">Mascota</label>
            <select name="mascota" id="mascota" class="form-control" required>
                <option value="">Seleccione una mascota</option>
                {% for mascota in mascotas %}
                <option value="{{ mascota.id }}">{{ mascota.nombre }} ({{ mascota.cliente.nombre_completo }})</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="veterinario">Veterinario (Opcional)</label>
            <select name="veterinario" id="veterinario" class="form-control">
                <option value="">Cualquier veterinario</option>
                {% for vet in veterinarios %}
                <option value="{{ vet.id }}">{{ vet.get_full_name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="fecha">Fecha</label>
                <input type="date" name="fecha" id="fecha" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="hora">Hora</label>
                <input type="time" name="hora" id="hora" class="form-control" required>
            </div>
        </div>

        <div class="form-group">
            <label for="motivo">Motivo de la Cita</label>
            <input type="text" name="motivo" id="motivo" class="form-control" placeholder="Ej: Vacunación, Consulta general" required>
        </div>
        
        <div class="form-actions">
            <a href="{% url 'listar_citas' %}" class="btn btn-secondary">
                <i class="fas fa-times"></i> Cancelar
            </a>
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-calendar-check"></i> Programar Cita
            </button>
        </div>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/citas/citas.js' %}"></script>
{% endblock %}
