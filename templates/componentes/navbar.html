{% load static %}
<header class="navbar">
    <div class="navbar-left">
        <button id="toggle-sidebar" class="toggle-btn">
            <i class="fas fa-bars"></i>
        </button>
        <div class="page-title">
            <h2>{% block page_title %}Dashboard{% endblock %}</h2>
            <p>Bienvenido, {{ user.get_full_name|default:user.username }}</p>
        </div>
    </div>

    <div class="navbar-right">
        <div class="theme-toggle">
            <button class="icon-btn" id="theme-toggle-btn" title="Cambiar modo">
                <i class="fas fa-moon"></i>
            </button>
        </div>
        
        <div class="notifications">
            <button class="icon-btn">
                <i class="far fa-bell"></i>
                <span class="badge">3</span>
            </button>
        </div>
        
        <div class="profile-dropdown" id="profile-dropdown">
            <img src="{% if user.foto %}{{ user.foto.url }}{% else %}{% static 'img/default-user.png' %}{% endif %}" alt="Profile">
            <i class="fas fa-chevron-down"></i>
            <div class="dropdown-menu" id="dropdown-menu">
                <a href="{% url 'perfil' %}">
                    <i class="fas fa-user-cog"></i> 
                    <span>Mi Perfil</span>
                </a>
                <form action="{% url 'logout' %}" method="POST">
                    {% csrf_token %}
                    <button type="submit" class="dropdown-item-btn">
                        <i class="fas fa-sign-out-alt"></i> 
                        <span>Cerrar Sesión</span>
                    </button>
                </form>
            </div>
        </div>
    </div>
</header>
