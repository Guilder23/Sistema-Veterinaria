{% extends 'base/base.html' %}
{% load static %}

{% block title %}Editar Categoría - {{ categoria.nombre }}{% endblock %}

{% block page_title %}Editar Categoría: {{ categoria.nombre }}{% endblock %}

{% block content %}
<div class="card form-card">
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label for="nombre">Nombre de la Categoría</label>
            <input type="text" name="nombre" id="nombre" class="form-control" value="{{ categoria.nombre }}" required>
        </div>
        <div class="form-group">
            <label for="descripcion">Descripción (Opcional)</label>
            <textarea name="descripcion" id="descripcion" class="form-control">{{ categoria.descripcion }}</textarea>
        </div>
        <div class="form-actions">
            <a href="{% url 'listar_categorias' %}" class="btn btn-secondary">
                <i class="fas fa-times"></i> Cancelar
            </a>
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i> Actualizar Categoría
            </button>
        </div>
    </form>
</div>
{% endblock %}
