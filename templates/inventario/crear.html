{% extends 'base/base.html' %}
{% load static %}

{% block title %}Nuevo Producto - VetCare{% endblock %}

{% block page_title %}Agregar Producto{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/inventario/inventario.css' %}">
{% endblock %}

{% block content %}
<div class="card form-card">
    <form method="POST">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="categoria">Categoría</label>
            <select name="categoria" id="categoria" class="form-control" required>
                <option value="">Seleccione una categoría</option>
                {% for cat in categorias %}
                <option value="{{ cat.id }}">{{ cat.nombre }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="nombre">Nombre del Producto</label>
            <input type="text" name="nombre" id="nombre" class="form-control" required>
        </div>

        <div class="form-group">
            <label for="descripcion">Descripción</label>
            <textarea name="descripcion" id="descripcion" class="form-control"></textarea>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="precio_compra">Precio Compra</label>
                <input type="number" step="0.01" name="precio_compra" id="precio_compra" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="precio_venta">Precio Venta</label>
                <input type="number" step="0.01" name="precio_venta" id="precio_venta" class="form-control" required>
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="stock">Stock Inicial</label>
                <input type="number" name="stock" id="stock" class="form-control" value="0" required>
            </div>
            <div class="form-group">
                <label for="stock_minimo">Stock Mínimo (Alerta)</label>
                <input type="number" name="stock_minimo" id="stock_minimo" class="form-control" value="5" required>
            </div>
        </div>

        <div class="form-group">
            <label class="checkbox-container">
                <input type="checkbox" name="es_medicamento" id="es_medicamento">
                <span class="checkmark"></span>
                Es un medicamento
            </label>
        </div>

        <div class="form-group" id="vencimiento-group">
            <label for="fecha_vencimiento">Fecha de Vencimiento</label>
            <input type="date" name="fecha_vencimiento" id="fecha_vencimiento" class="form-control">
        </div>
        
        <div class="form-actions">
            <a href="{% url 'listar_productos' %}" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">Guardar Producto</button>
        </div>
    </form>
</div>
{% endblock %}
