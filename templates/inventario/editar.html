{% extends 'base/base.html' %}
{% load static %}

{% block title %}Editar Producto - {{ producto.nombre }}{% endblock %}

{% block page_title %}Editar Producto{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/inventario/inventario.css' %}">
{% endblock %}

{% block content %}
<div class="card form-card">
    <form method="POST">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="categoria">Categoría</label>
            <select name="categoria" id="categoria" class="form-control" required>
                {% for cat in categorias %}
                <option value="{{ cat.id }}" {% if cat.id == producto.categoria.id %}selected{% endif %}>
                    {{ cat.nombre }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="nombre">Nombre del Producto</label>
            <input type="text" name="nombre" id="nombre" class="form-control" value="{{ producto.nombre }}" required>
        </div>

        <div class="form-group">
            <label for="descripcion">Descripción</label>
            <textarea name="descripcion" id="descripcion" class="form-control">{{ producto.descripcion }}</textarea>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="precio_compra">Precio Compra</label>
                <input type="number" step="0.01" name="precio_compra" id="precio_compra" class="form-control" value="{{ producto.precio_compra }}" required>
            </div>
            <div class="form-group">
                <label for="precio_venta">Precio Venta</label>
                <input type="number" step="0.01" name="precio_venta" id="precio_venta" class="form-control" value="{{ producto.precio_venta }}" required>
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="stock">Stock Actual</label>
                <input type="number" name="stock" id="stock" class="form-control" value="{{ producto.stock }}" required>
            </div>
            <div class="form-group">
                <label for="stock_minimo">Stock Mínimo (Alerta)</label>
                <input type="number" name="stock_minimo" id="stock_minimo" class="form-control" value="{{ producto.stock_minimo }}" required>
            </div>
        </div>

        <div class="form-group">
            <label class="checkbox-container">
                <input type="checkbox" name="es_medicamento" id="es_medicamento" {% if producto.es_medicamento %}checked{% endif %}>
                <span class="checkmark"></span>
                Es un medicamento
            </label>
        </div>

        <div class="form-group" id="vencimiento-group">
            <label for="fecha_vencimiento">Fecha de Vencimiento</label>
            <input type="date" name="fecha_vencimiento" id="fecha_vencimiento" class="form-control" value="{{ producto.fecha_vencimiento|date:'Y-m-d' }}">
        </div>
        
        <div class="form-actions">
            <a href="{% url 'listar_productos' %}" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">Actualizar Producto</button>
        </div>
    </form>
</div>
{% endblock %}
