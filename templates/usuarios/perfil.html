{% extends 'base/base.html' %}
{% load static %}

{% block title %}Mi Perfil - VetCare{% endblock %}

{% block page_title %}Mi Perfil{% endblock %}

{% block content %}
<div class="card form-card" style="max-width: 700px;">
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div class="profile-header d-flex align-center gap-1 mb-1">
            <div class="profile-img-container">
                <img src="{% if user.foto %}{{ user.foto.url }}{% else %}{% static 'img/default-user.png' %}{% endif %}" alt="User" id="profile-preview" style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid var(--primary-color);">
            </div>
            <div class="profile-info">
                <h4>{{ user.get_full_name|default:user.username }}</h4>
                <p class="role-badge">{{ user.get_rol_display }}</p>
            </div>
        </div>

        <div class="form-group">
            <label for="foto">Cambiar Foto de Perfil</label>
            <input type="file" name="foto" id="foto" class="form-control" accept="image/*" onchange="previewImage(this)">
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="first_name">Nombre(s)</label>
                <input type="text" name="first_name" id="first_name" class="form-control" value="{{ user.first_name }}">
            </div>
            <div class="form-group">
                <label for="last_name">Apellidos</label>
                <input type="text" name="last_name" id="last_name" class="form-control" value="{{ user.last_name }}">
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" name="email" id="email" class="form-control" value="{{ user.email }}">
            </div>
            <div class="form-group">
                <label for="telefono">Teléfono</label>
                <input type="text" name="telefono" id="telefono" class="form-control" value="{{ user.telefono|default:'' }}">
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i> Guardar Cambios
            </button>
        </div>
    </form>
</div>

<script>
    function previewImage(input) {
        if (input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('profile-preview').src = e.target.result;
            }
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>
{% endblock %}
